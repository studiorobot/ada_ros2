controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    jaco_arm_controller:
      type: force_gate_controller/ForceGateController

    jaco_arm_servo_controller:
      type: force_gate_controller/ForceGatePositionController

    jaco_arm_cartesian_controller:
      type: cartesian_twist_controller/CartesianTwistController

    twist_controller:
      type: picknik_twist_controller/PicknikTwistController

    robotiq_gripper_controller:
      type: position_controllers/GripperActionController

    fault_controller:
      type: picknik_reset_fault_controller/PicknikResetFaultController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - ada_joint_1
      - ada_joint_2
      - ada_joint_3
      - ada_joint_4
      - ada_joint_5
      - ada_joint_6
      - ada_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

twist_controller:
  ros__parameters:
    joint: tcp
    interface_names:
      - twist.linear.x
      - twist.linear.y
      - twist.linear.z
      - twist.angular.x
      - twist.angular.y
      - twist.angular.z

robotiq_gripper_controller:
  ros__parameters:
    default: true
    joint: robotiq_85_left_knuckle_joint
    allow_stalling: true

joint_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    use_local_topics: false
    # QoS settings to match other publishers (VOLATILE instead of TRANSIENT_LOCAL)
    qos_overrides:
      /joint_states:
        publisher:
          reliability: reliable
          durability: volatile
          history: keep_last
          depth: 1

jaco_arm_cartesian_controller:
    ros__parameters:
      end_effector_link: "ada_end_effector_link"
      robot_base_link: "ada_base_link"
      ik_solver: "selectively_damped_least_squares"
      joints:
        - ada_joint_1
        - ada_joint_2
        - ada_joint_3
        - ada_joint_4
        - ada_joint_5
        - ada_joint_6
        - ada_joint_7
      command_interfaces:
        - position

jaco_arm_controller:
  ros__parameters:
    joints:
      - ada_joint_1
      - ada_joint_2
      - ada_joint_3
      - ada_joint_4
      - ada_joint_5
      - ada_joint_6
      - ada_joint_7
    command_joints:
      - ada_joint_1
      - ada_joint_2
      - ada_joint_3
      - ada_joint_4
      - ada_joint_5
      - ada_joint_6
      - ada_joint_7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    open_loop_control: false
    allow_integration_in_goal_trajectories: false
    gains:
      ada_joint_1: {p: 10.0, i: 0.0, d: 0.1, i_clamp_max: 1.0, i_clamp_min: -1.0}
      ada_joint_2: {p: 10.0, i: 0.0, d: 0.1, i_clamp_max: 1.0, i_clamp_min: -1.0}
      ada_joint_3: {p: 10.0, i: 0.0, d: 0.1, i_clamp_max: 1.0, i_clamp_min: -1.0}
      ada_joint_4: {p: 10.0, i: 0.0, d: 0.1, i_clamp_max: 1.0, i_clamp_min: -1.0}
      ada_joint_5: {p: 10.0, i: 0.0, d: 0.1, i_clamp_max: 1.0, i_clamp_min: -1.0}
      ada_joint_6: {p: 10.0, i: 0.0, d: 0.1, i_clamp_max: 1.0, i_clamp_min: -1.0}
      ada_joint_7: {p: 10.0, i: 0.0, d: 0.1, i_clamp_max: 1.0, i_clamp_min: -1.0}
    wrench_threshold:
      timeout: 0.1
      fMag: 4.0
      fx: 0.0
      fy: 0.0
      fz: 0.0
      tMag: 0.0
      tx: 0.0
      ty: 0.0
      tz: 0.0

jaco_arm_servo_controller:
  ros__parameters:
    joints:
      - ada_joint_1
      - ada_joint_2
      - ada_joint_3
      - ada_joint_4
      - ada_joint_5
      - ada_joint_6
      - ada_joint_7
